<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Supabase</title>
</head>
<body>
    <h1>🔍 Teste Supabase</h1>
    <div id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.0/umd/supabase.min.js">
</script>

    <script>
        // ============================================================
        // 🔴 SUBSTITUA PELAS SUAS CREDENCIAIS!
        // ============================================================
        const SUPABASE_URL = 'https://muzqekuyafbqvogdulvj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11enFla3V5YWZicXZvZ2R1bHZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MjMyNDEsImV4cCI6MjEwNDM5OTI0MX0.TVvfTS8h7C0PofhHNKZKIsqUezMidza44r5qewP9VyA';

        const log = document.getElementById('log');

        function addLog(msg, isError = false) {
            const p = document.createElement('p');
            p.textContent = msg;
            p.style.color = isError ? 'red' : 'green';
            p.style.fontFamily = 'monospace';
            log.appendChild(p);
            console.log(msg);
        }

        addLog('🚀 Iniciando teste...');

        // Verificar se a biblioteca carregou
        if (typeof supabaseJs === 'undefined') {
            addLog('❌ Biblioteca Supabase não carregou! Verifique a internet.', true);
        } else {
            addLog('✅ Biblioteca Supabase carregada!');

            // Criar cliente
            try {
                const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                addLog('✅ Cliente criado!');

                // Testar conexão
                addLog('📡 Tentando buscar módulos...');

                supabase
                    .from('modulos')
                    .select('*')
                    .then(({ data, error }) => {
                        if (error) {
                            addLog('❌ Erro na consulta: ' + error.message, true);
                            addLog('📋 Detalhes:', true);
                            addLog(JSON.stringify(error, null, 2), true);
                            return;
                        }
                        addLog('✅ Dados obtidos!');
                        addLog('📦 Módulos encontrados: ' + (data?.length || 0));
                        if (data && data.length > 0) {
                            data.forEach(m => {
                                addLog(`  • ${m.icon || '📦'} ${m.nome} (${m.sigla})`);
                            });
                        }
                    });

                // Testar autenticação
                addLog('🔑 Testando autenticação...');
                supabase.auth.signInWithPassword({
                    email: 'teste@email.com',
                    password: 'Teste@123'
                }).then(({ data, error }) => {
                    if (error) {
                        addLog('❌ Erro no login: ' + error.message, true);
                        return;
                    }
                    addLog('✅ Login realizado! Usuário: ' + data.user.email);
                });

            } catch (err) {
                addLog('❌ Erro ao criar cliente: ' + err.message, true);
            }
        }
    </script>
</body>
</html>
