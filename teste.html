<!DOCTYPE html>
<html>

</head>
<body>
    <h1>🔄 Teste Supabase</h1>
    <div id="status">Conectando...</div>
    <div id="dados"></div>

    <script>
        // ============================================================
        // SUBSTITUA PELAS SUAS CREDENCIAIS!
        // ============================================================
        const SUPABASE_URL = 'https://muzqekuyafbqvogdulvj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11enFla3V5YWZicXZvZ2R1bHZqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODgyMzI0MSwiZXhwIjoyMTA0Mzk5MjQxfQ.LSqrcmMroZryob1o3z_lIm_7ku9olpRgaK_zUhdDgyU';

        // Criar cliente
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testar() {
            const status = document.getElementById('status');
            const dados = document.getElementById('dados');

            try {
                // 1. Testar conexão com banco
                const { data: modulos, error } = await supabase
                    .from('modulos')
                    .select('*');

                if (error) throw error;

                status.innerHTML = '✅ Conectado com sucesso!';
                dados.innerHTML = `<pre>${JSON.stringify(modulos, null, 2)}</pre>`;

                // 2. Testar login
                console.log('🔑 Tentando login...');
                const { data: auth, error: authError } = await supabase.auth.signInWithPassword({
                    email: 'vani.saiefert@gmail.com',
                    password: 'Portal123'
                });

                if (authError) {
                    console.error('❌ Erro no login:', authError);
                } else {
                    console.log('✅ Login realizado!', auth);
                }

            } catch (err) {
                status.innerHTML = '❌ Erro: ' + err.message;
                console.error(err);
            }
        }

        testar();
    </script>
</body>
</html>
